[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nbclassic-extras"
dynamic = ["version"]
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE",
    "licenses/*",
    "static/rise/reveal.js/LICENSE",
]
readme = {file = "README.md", content-type = "text/markdown"}
description = "RISE and gist_it nbextensions for nbclassic, with no dependency on the notebook package."
authors = [
  {name = "Jesse Grabowski", email = "jessegrabowski@gmail.com"},
]
keywords = ["jupyter", "nbclassic", "nbextensions", "rise", "reveal.js", "gist"]
dependencies = ["nbclassic>=1.3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/jessegrabowski/nbclassic-extras"
Repository = "https://github.com/jessegrabowski/nbclassic-extras.git"
"Bug Tracker" = "https://github.com/jessegrabowski/nbclassic-extras/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "nbclassic_extras/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
  '/.github',
]

[tool.hatch.build.targets.wheel]
packages = ["nbclassic_extras"]

# Install each nbextension where nbclassic serves it and enable it through nbconfig, so a plain
# pip install needs no jupyter nbextension command.
[tool.hatch.build.targets.wheel.shared-data]
"static/rise" = "share/jupyter/nbextensions/rise"
"jupyter-config/notebook.d/rise.json" = "etc/jupyter/nbconfig/notebook.d/rise.json"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["nbclassic_extras"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"
nbclassic = ">=1.3"

[tool.pixi.pypi-dependencies]
nbclassic-extras = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8"
nodejs = ">=22.12"
pillow = "*"

[tool.pixi.feature.test.pypi-dependencies]
playwright = "*"

[tool.pixi.feature.test.tasks]
test = "pytest"
# npm ci reinstalls from scratch, so it reruns only when the lockfile or node_modules changed
js-install = { cmd = "npm ci", inputs = ["package.json", "package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
js-test = { cmd = "node --test 'tests/js/**/*.test.js'", depends-on = ["js-install"] }
install-browsers = "playwright install chromium"

[tool.pixi.feature.lint.dependencies]
pre-commit = "*"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files"

[tool.pixi.environments]
default = { features = ["test", "lint"], solve-group = "default" }
