Type: Jupyter Notebook Extension
Compatibility: 5.x, 6.x
Name: Gist-it
Main: main.js
Description: Adds a button to publish the current notebook as a GitHub gist. The Jupyter server publishes through the GitHub CLI, so gh must be installed and logged in where the server runs; see the readme.
Link: readme.md
Icon: icon.png
Parameters:
- name: gist_it_default_to_public
  description: Make new gists public unless unchecked in the dialog. Gists default to private.
  input_type: checkbox
  default: false
