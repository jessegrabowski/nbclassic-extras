# static/, licenses/ and the reveal patches hold upstream text that must stay byte-identical.
exclude: ^(static|licenses|scripts/reveal_patches)/

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.13
  hooks:
    - id: ruff-check
      args: [ --fix, --exit-non-zero-on-fix ]
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: local
  hooks:
    - id: pixi-lock-check
      name: pixi.lock is in sync with pyproject.toml
      entry: pixi lock --check
      language: system
      files: ^(pyproject\.toml|pixi\.lock)$
      pass_filenames: false
